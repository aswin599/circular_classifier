<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circulars - Mark as Read</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #18212f;
    display: grid;
    place-items: center;
    padding: 32px 18px;
  }

  .app {
    width: min(820px, 100%);
  }

  .header {
    margin-bottom: 18px;
  }

  .header h1 {
    margin: 0 0 6px;
    font-size: 27px;
  }

  .header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .circular {
    position: relative;
    overflow: hidden;
    background: #fff;
    border: 1px solid #e6eaf0;
    border-radius: 15px;
    box-shadow: 0 7px 22px rgba(20, 30, 50, 0.05);
    transition: transform 420ms cubic-bezier(.2,.8,.2,1),
                opacity 300ms ease,
                height 420ms cubic-bezier(.2,.8,.2,1),
                margin 420ms cubic-bezier(.2,.8,.2,1);
  }

  .circular.removing {
    transform: translateX(120%);
    opacity: 0;
  }

  .row {
    min-height: 88px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: center;
    padding: 18px 20px;
  }

  .content h3 {
    margin: 0 0 5px;
    font-size: 16px;
  }

  .content p {
    margin: 0;
    color: #6b7280;
    font-size: 13px;
  }

  .meta {
    margin-top: 7px;
    display: flex;
    gap: 8px;
    font-size: 11px;
    color: #8a94a3;
  }

  .read-control {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: #4b5563;
    font-size: 13px;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
  }

  .read-control input {
    width: 19px;
    height: 19px;
    accent-color: #2563eb;
    cursor: pointer;
  }

  .success {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    background: #fff;
    opacity: 0;
    transform: translateX(-30px);
    pointer-events: none;
  }

  .circular.show-success .success {
    animation: successIn 620ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  .check {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #16a34a;
    color: white;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    transform: scale(.4) rotate(-25deg);
    animation: checkPop 520ms 120ms cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .success-text {
    font-size: 14px;
    font-weight: 600;
    color: #15803d;
  }

  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: #8a94a3;
  }

  @keyframes successIn {
    0% { opacity: 0; transform: translateX(-30px); }
    35% { opacity: 1; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(0); }
  }

  @keyframes checkPop {
    0% { transform: scale(.4) rotate(-25deg); }
    70% { transform: scale(1.12) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @media (max-width: 600px) {
    .row {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .read-control { justify-content: flex-start; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="header">
    <h1>📢 Circulars</h1>
    <p>Check <b>Mark as read</b> to dismiss a circular.</p>
  </div>

  <section class="list" id="circularList"></section>
  <div class="hint">The other circulars automatically move up into the empty space.</div>
</main>

<script>
const circulars = [
  ["CSE Department Meeting", "Faculty and students are requested to attend the monthly department meeting.", "Today · 10:00 AM"],
  ["Internal Assessment Schedule", "The IA-2 examination schedule has been published.", "Yesterday · 4:30 PM"],
  ["Placement Training Session", "Aptitude and coding preparation session is scheduled this Friday.", "Sep 16 · 11:20 AM"],
  ["Library Timing Update", "The central library will remain open until 9:00 PM on weekdays.", "Sep 15 · 2:10 PM"],
  ["Holiday Notice", "The institution will remain closed on the announced public holiday.", "Sep 14 · 9:05 AM"]
];

const list = document.getElementById("circularList");

function render() {
  list.innerHTML = circulars.map((c, i) => `
    <article class="circular" data-index="${i}">
      <div class="row">
        <div class="content">
          <h3>${c[0]}</h3>
          <p>${c[1]}</p>
          <div class="meta">${c[2]} · Circular #${1001 + i}</div>
        </div>
        <label class="read-control">
          <input type="checkbox" aria-label="Mark ${c[0]} as read" />
          <span>Mark as read</span>
        </label>
      </div>
      <div class="success">
        <div class="check">✓</div>
        <div class="success-text">Removed successfully</div>
      </div>
    </article>
  `).join("");

  list.querySelectorAll("input").forEach(box => {
    box.addEventListener("change", handleRead);
  });
}

function handleRead(event) {
  const card = event.target.closest(".circular");
  if (!event.target.checked || card.classList.contains("removing")) return;

  card.classList.add("show-success");

  // Keep the success message visible briefly, then slide the item away.
  setTimeout(() => {
    card.classList.add("removing");
  }, 700);

  // Collapse its height so all other circulars smoothly move to the top.
  setTimeout(() => {
    card.style.height = card.offsetHeight + "px";
    requestAnimationFrame(() => {
      card.style.height = "0px";
      card.style.marginBottom = "-10px";
    });
  }, 980);

  // Remove from DOM after the slide/collapse.
  setTimeout(() => {
    card.remove();
  }, 1450);
}

render();
</script>
</body>
</html>
